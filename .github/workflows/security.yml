name: Security Scanning

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The default GITHUB_TOKEN is read-only on this repository; uploading SARIF to
# the Security tab needs security-events: write (the previous runs failed with
# "Resource not accessible by integration").
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  container-scan:
    name: Container Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t pysoar-backend:scan .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'pysoar-backend:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit

      - name: Run pip-audit
        # Enforcing since 2026-10: the requirement set audits clean (cryptography
        # 50, msal 1.39, react-router 7.18, axios 1.20). A reintroduced advisory
        # fails the job instead of being filed away in an artifact nobody reads.
        run: pip-audit -r requirements.txt --format json --output pip-audit-results.json

      # The former "safety check || true" step is gone: safety was never
      # installed in this job, so the step always passed without scanning
      # anything. pip-audit above is the enforcing dependency scan.

      - name: Upload pip-audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-results
          path: pip-audit-results.json
