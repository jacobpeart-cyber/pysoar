name: Security Scanning

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The default GITHUB_TOKEN is read-only on this repository; uploading SARIF to
# the Security tab needs security-events: write (the previous runs failed with
# "Resource not accessible by integration").
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  container-scan:
    name: Container Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t pysoar-backend:scan .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'pysoar-backend:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit

      - name: Run pip-audit
        # Enforcing since 2026-10: the requirement set audits clean (cryptography
        # 50, msal 1.39, react-router 7.18, axios 1.20). A reintroduced advisory
        # fails the job instead of being filed away in an artifact nobody reads.
        run: pip-audit -r requirements.txt --format json --output pip-audit-results.json

      # The former "safety check || true" step is gone: safety was never
      # installed in this job, so the step always passed without scanning
      # anything. pip-audit above is the enforcing dependency scan.

      - name: Upload pip-audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-results
          path: pip-audit-results.json

  secrets-scan:
    # Enforcing: a finding fails the job. This repository once committed a
    # live .env (the history was purged), so committed credentials are
    # scanned for on every push and pull request. Rules: the gitleaks default
    # set; .gitleaks.toml allow-lists reviewed false positives by exact
    # pattern only (no path allow-list). Two scans: the checked-out tree, and
    # the commits this event brings (push: before..after; pull request:
    # base..head; schedule: the last 50 commits). The full history is not
    # rescanned on every run.
    name: Secrets Scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      # gitleaks v8.28.0, pinned to the multi-arch index digest.
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the checked-out tree
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$GITLEAKS_IMAGE" \
            detect --source . --no-git --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Scan the commits of this push or pull request
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          zero=0000000000000000000000000000000000000000
          case "$EVENT_NAME" in
            pull_request)
              range="$PR_BASE..$PR_HEAD" ;;
            push)
              if [ "$PUSH_BEFORE" = "$zero" ] || ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                # New branch or a force push whose old tip is gone: scan the pushed tip.
                range="$PUSH_AFTER~1..$PUSH_AFTER"
              else
                range="$PUSH_BEFORE..$PUSH_AFTER"
              fi ;;
            *)
              range="HEAD~50..HEAD" ;;
          esac
          echo "gitleaks commit range: $range"
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            "$GITLEAKS_IMAGE" \
            detect --source . --config .gitleaks.toml --log-opts="$range" --redact --no-banner --exit-code 1
