name: Release

# Cuts a PySOAR release from a `v*` tag. The steps, and what each produces, are
# documented in docs/releases/RELEASING.md; keep the two in step.
#
#   1. verify   - the tag must be exactly "v" + the VERSION file, the tagged
#                 commit must be on main, and the CI/CD Pipeline (ci.yml) must
#                 have passed on that commit. Any failure stops the release
#                 before anything is pushed.
#   2. images   - builds and pushes ghcr.io/<owner>/pysoar-backend and
#                 ghcr.io/<owner>/pysoar-frontend tagged <version>,
#                 <major>.<minor> (not for pre-releases) and sha-<short>, with
#                 OCI labels, then generates an SPDX SBOM of each pushed image.
#   3. release  - creates the GitHub release: notes from CHANGELOG.md (when it
#                 has a section for this version) plus the commit log since the
#                 previous tag, the image digests, and both SBOMs attached.
#
# Third-party actions are pinned to full commit SHAs (the comment names the
# release the SHA was resolved from).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify tag, VERSION and CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      major_minor: ${{ steps.version.outputs.major_minor }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      owner: ${{ steps.version.outputs.owner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Tag must equal v + VERSION
        id: version
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::VERSION holds '$version', which is not a semantic version"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' does not match VERSION ($version); the tag must be 'v$version'"
            exit 1
          fi
          prerelease=false
          if [ -n "${BASH_REMATCH[4]}" ]; then prerelease=true; fi
          {
            echo "version=$version"
            echo "major_minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            echo "prerelease=$prerelease"
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $version (prerelease: $prerelease)"

      - name: Tagged commit must be on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; tag a commit that has been merged to main"
            exit 1
          fi

      - name: CI must have passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusions="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --event push --limit 20 \
            --json conclusion --jq '.[].conclusion')"
          if ! grep -qx success <<< "$conclusions"; then
            echo "::error::no successful CI/CD Pipeline run (ci.yml, push event) for $GITHUB_SHA; wait for CI to pass on main, then re-push the tag"
            echo "conclusions seen: ${conclusions:-none}"
            exit 1
          fi

  images:
    name: Build, push and SBOM (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: pysoar-backend
            context: .
            file: ./Dockerfile
            target: production
          - image: pysoar-frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            target: ""
    env:
      IMAGE: ghcr.io/${{ needs.verify.outputs.owner }}/${{ matrix.image }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and OCI labels
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=${{ needs.verify.outputs.major_minor }},enable=${{ needs.verify.outputs.prerelease == 'false' }}
            type=sha,prefix=sha-,format=short
          # metadata-action also sets source, revision (the tagged commit) and
          # created; version is set explicitly so it is VERSION, not a tag.
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PYSOAR_COMMIT=${{ github.sha }}
            PYSOAR_VERSION=${{ needs.verify.outputs.version }}
            PYSOAR_BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Prepare output directory
        run: mkdir -p dist

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@da167eac915b4e86f08b264dbdbc867b61be6f0c # v0.20.5
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: dist/${{ matrix.image }}-${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Record the pushed digest
        run: echo "${IMAGE}@${{ steps.build.outputs.digest }}" > "dist/${{ matrix.image }}.digest"

      - name: Upload SBOM and digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.image }}
          path: dist/
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [verify, images]
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      OWNER: ${{ needs.verify.outputs.owner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Download SBOMs and digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Release notes
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          prev="$(git describe --tags --abbrev=0 --match 'v*' "${tag}^" 2>/dev/null || true)"
          {
            echo "## PySOAR $VERSION"
            echo
            if [ -f CHANGELOG.md ]; then
              section="$(awk -v h="## [$VERSION]" 'index($0, h) == 1 {f = 1; next} /^## \[/ {if (f) exit} f' CHANGELOG.md)"
              if [ -n "$section" ]; then
                echo "$section"
                echo
              fi
            fi
            echo "### Images"
            echo
            echo '```'
            echo "docker pull ghcr.io/$OWNER/pysoar-backend:$VERSION"
            echo "docker pull ghcr.io/$OWNER/pysoar-frontend:$VERSION"
            echo '```'
            echo
            echo "Digests:"
            echo
            for d in dist/*.digest; do echo "- \`$(cat "$d")\`"; done
            echo
            echo "SPDX SBOMs for both images are attached to this release."
            echo
            echo "### Commits"
            echo
            if [ -n "$prev" ]; then
              echo "Since $prev:"
              echo
              git log --no-merges --pretty='- %h %s' "$prev..$tag"
            else
              echo "First tagged release: there is no earlier tag to compare against, so no commit list is generated."
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create release with SBOMs attached
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "PySOAR $VERSION" \
            --notes-file RELEASE_NOTES.md \
            "${flags[@]}" \
            dist/*.spdx.json
