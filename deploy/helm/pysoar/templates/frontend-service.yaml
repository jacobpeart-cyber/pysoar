apiVersion: v1
kind: Service
metadata:
  name: {{ include "pysoar.fullname" . }}-frontend
  labels:
    {{- include "pysoar.componentLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "pysoar.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
