apiVersion: v1
kind: Service
metadata:
  name: {{ include "pysoar.apiServiceName" . }}
  labels:
    {{- include "pysoar.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "pysoar.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
