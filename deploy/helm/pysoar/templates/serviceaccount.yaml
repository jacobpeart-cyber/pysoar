{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pysoar.serviceAccountName" . }}
  labels:
    {{- include "pysoar.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# PySOAR does not call the Kubernetes API of the cluster it runs in, so no
# token is mounted.
automountServiceAccountToken: false
{{- end }}
