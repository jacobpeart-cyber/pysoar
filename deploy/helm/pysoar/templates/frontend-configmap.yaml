apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pysoar.fullname" . }}-frontend-nginx
  labels:
    {{- include "pysoar.componentLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
data:
  # Replaces the image's /etc/nginx/conf.d/default.conf (frontend/nginx.conf).
  # Based on the hardened nginx/default.conf, with two changes for
  # Kubernetes: nginx listens on an unprivileged port (the container runs as
  # the nginx user), and the API upstream is this release's api Service
  # instead of the compose hostname "api". The ingress normally routes /api
  # straight to the api Service; these proxy locations keep the frontend
  # Service usable on its own (kubectl port-forward).
  default.conf: |
    server {
        listen {{ .Values.frontend.port }};
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss: ws:; frame-ancestors 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location ~ /\. {
            return 444;
        }
        location ~* \.(env|bak|orig|old|save|swp|sql|log|ini|cfg|conf|yml|yaml|toml|pem|key|crt|p12|pfx)$ {
            return 444;
        }
        location ~* (apikeys|credentials|secrets|password|token|config)\. {
            return 444;
        }

        location /api/v1/ws {
            proxy_pass http://{{ include "pysoar.apiServiceName" . }}.{{ .Release.Namespace }}.svc:{{ .Values.api.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # /api/ with the trailing slash so SPA routes such as /api-security
        # and /api-keys are not proxied.
        location /api/ {
            proxy_pass http://{{ include "pysoar.apiServiceName" . }}.{{ .Release.Namespace }}.svc:{{ .Values.api.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            client_max_body_size 50M;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri /index.html;
        }
    }
